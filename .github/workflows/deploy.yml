name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 6-Layer QA Verification
        run: npm run verify

      # Workload Identity Federation によるセキュアな認証（秘密鍵JSON不要）
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/819933730656/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-deployer@project-af21d0bc-5f83-49ad-b24.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy team-monthly-slackbot \
            --source . \
            --region asia-northeast1 \
            --project project-af21d0bc-5f83-49ad-b24 \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --quiet

      - name: Verify Deployed Cloud Run Health (/health)
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe team-monthly-slackbot --region asia-northeast1 --project project-af21d0bc-5f83-49ad-b24 --format="value(status.url)")
          echo "Service URL: ${SERVICE_URL}"
          
          attempt=1
          max_attempts=3
          sleep_sec=2
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt of $max_attempts..."
            if curl -fsS "${SERVICE_URL}/health" | grep -q '"status":"healthy"'; then
              echo "Health check passed!"
              exit 0
            fi
            if [ $attempt -eq $max_attempts ]; then
              echo "Health check failed after $max_attempts attempts."
              exit 1
            fi
            echo "Retrying in ${sleep_sec} seconds..."
            sleep $sleep_sec
            sleep_sec=$((sleep_sec * 2))
            attempt=$((attempt + 1))
          done

      - name: Cleanup Old Artifact Registry Images (Free Tier 0.5GB Protection)
        run: |
          set -euo pipefail
          IMAGE_PATH="asia-northeast1-docker.pkg.dev/project-af21d0bc-5f83-49ad-b24/cloud-run-source-deploy/team-monthly-slackbot"
          echo "Fetching image digests for ${IMAGE_PATH}..."
          
          VERSIONS=$(gcloud artifacts docker images list "${IMAGE_PATH}" --sort-by="~CREATE_TIME" --format="value(version)")
          
          if [ -z "$VERSIONS" ]; then
            echo "No images found or registry not yet populated."
            exit 0
          fi
          
          OLD_VERSIONS=$(echo "$VERSIONS" | tail -n +3)
          
          if [ -z "$OLD_VERSIONS" ]; then
            echo "Total images are 2 or fewer. No cleanup needed."
            exit 0
          fi
          
          echo "Cleaning up old image versions..."
          for digest in $OLD_VERSIONS; do
            echo "Deleting image digest: ${IMAGE_PATH}@${digest}"
            gcloud artifacts docker images delete "${IMAGE_PATH}@${digest}" --delete-tags --quiet
          done
          echo "Artifact Registry cleanup completed."
